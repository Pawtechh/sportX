<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPelotas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <linearGradient id="voltPelotas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#99EE00" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgPelotas)" />
  <!-- Ball Graphic -->
  <g transform="translate(110, 80) scale(0.9)" fill="none" stroke="#27272A" stroke-width="5">
    <circle cx="100" cy="100" r="90" fill="#FFFFFF" stroke="#27272A" stroke-width="6" />
    <!-- Ball Seams / Grooves -->
    <path d="M 10 100 Q 100 60 190 100" stroke="#27272A" stroke-width="5" />
    <path d="M 100 10 Q 60 100 100 190" stroke="#27272A" stroke-width="5" />
    <path d="M 100 10 Q 140 100 100 190" stroke="url(#voltPelotas)" stroke-width="6" />
    <line x1="10" y1="100" x2="190" y2="100" stroke="#71717A" stroke-width="4" stroke-dasharray="6 4" />
    <line x1="100" y1="10" x2="100" y2="190" stroke="#71717A" stroke-width="4" stroke-dasharray="6 4" />
  </g>
  <!-- Text Label -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#71717A">
    SPORTX • BALONES
  </text>
</svg>
