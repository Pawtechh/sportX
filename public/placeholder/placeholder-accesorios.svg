<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <linearGradient id="voltAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#99EE00" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgAcc)" />
  <!-- Backpack / Gear Silhouette -->
  <g transform="translate(120, 80) scale(0.8)" fill="none" stroke="#27272A" stroke-width="6" stroke-linejoin="round">
    <!-- Top Handle -->
    <path d="M 70 30 C 70 10 130 10 130 30" fill="none" stroke="#27272A" stroke-width="7" />
    <!-- Bag Body -->
    <rect x="30" y="30" width="140" height="180" rx="25" fill="#FFFFFF" stroke="#27272A" stroke-width="6" />
    <!-- Front Pocket -->
    <rect x="45" y="110" width="110" height="85" rx="15" fill="#F4F4F5" stroke="#27272A" stroke-width="5" />
    <!-- Volt Accent Strip -->
    <line x1="55" y1="110" x2="145" y2="110" stroke="url(#voltAcc)" stroke-width="6" stroke-linecap="round" />
    <!-- Zipper -->
    <line x1="60" y1="70" x2="140" y2="70" stroke="#71717A" stroke-width="4" stroke-dasharray="4 3" />
  </g>
  <!-- Text Label -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#71717A">
    SPORTX • ACCESORIOS
  </text>
</svg>
