services:
  - type: web
    name: sportx-ecommerce
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx vite build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
